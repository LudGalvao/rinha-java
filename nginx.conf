worker_processes 1;
error_log /dev/null crit;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    sendfile   on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 10000;

    upstream api {
        server api01:8080;
        server api02:8080;
        keepalive 64;
    }

    server {
        listen 9999;

        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }
    }
}
